name: typed_settings_example
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  hive_ce_flutter: ^2.6.0
  json_schema_builder: ^0.1.7
  material_ui: ^1.11.0
  sqlite3_flutter_libs: ^0.6.0+eol
  typed_settings:
    path: ../packages/typed_settings
  typed_settings_drift:
    path: ../packages/typed_settings_drift
  typed_settings_flutter:
    path: ../packages/typed_settings_flutter
  typed_settings_hive:
    path: ../packages/typed_settings_hive
  typed_settings_json_schema:
    path: ../packages/typed_settings_json_schema
  typed_settings_json_schema_flutter:
    path: ../packages/typed_settings_json_schema_flutter
  typed_settings_secure_storage:
    path: ../packages/typed_settings_secure_storage
  typed_settings_shared_preferences:
    path: ../packages/typed_settings_shared_preferences

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  typed_settings:
    path: ../packages/typed_settings
  typed_settings_flutter:
    path: ../packages/typed_settings_flutter
  typed_settings_json_schema:
    path: ../packages/typed_settings_json_schema
  typed_settings_json_schema_flutter:
    path: ../packages/typed_settings_json_schema_flutter

flutter:
  uses-material-design: true
